<style>
  :root {
    --bg: #f8f9fb;
    --surface-2: #dfe4ec;
    --paper: #ffffff;
    --ink: #141b2e;
    --muted: #4a5168;
    --blue: #1b2f6b;
    --sky: #9ec8ec;
    --accent: #f2661f;
    --accent-strong: #ff7a36;
    --on-blue: #ffffff;
    --blue-2: #2a47a0;
    --blue-3: #3557b8;
    --accent-text: #c2410c;

    --font: 'Erode', Georgia, serif;
    /* Cinco tamaños: chico, texto, entrada, título, cartel. */
    --step-body: 1.125rem;
    --step-lead: clamp(1.375rem, 1.1rem + 0.8vw, 1.625rem);
    --step-head: clamp(2.125rem, 1.4rem + 2.9vw, 4rem);
    --step-display: clamp(2.75rem, 0.6rem + 7.4vw, 7.25rem);

    --m: clamp(20px, 2.5vw, 36px);
    --gap: clamp(16px, 1.7vw, 24px);
    --bar: 64px;

    /* Movimiento (transitions.dev + tasteskill) */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --t-press: 140ms;
    --t-hover: 180ms;
    --modal-open-dur: 250ms;
    --modal-close-dur: 150ms;
    --modal-scale: 0.96;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: var(--bar); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--step-body)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  body.is-locked { overflow: hidden; }
  h1, h2, h3 { margin: 0; font-weight: 500; letter-spacing: -0.025em; line-height: 0.98; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  ::selection { background: var(--accent); color: var(--ink); }
  .wrap { padding-inline: var(--m); }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: var(--m); top: -60px; z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 16px; text-decoration: none; }
  .skip:focus { top: 8px; }

  /* Botón (convención shadcn: data-slot="button" + data-variant) */
  [data-slot="button"] {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; padding: 0 22px; border: 0; border-radius: 0; cursor: pointer;
    font: 600 var(--step-body)/1 var(--font); text-decoration: none; white-space: nowrap;
    transition: transform var(--t-press) var(--ease-out), background-color var(--t-hover) ease, color var(--t-hover) ease;
  }
  [data-slot="button"]:active { transform: scale(0.97); }
  [data-variant="default"] { background: var(--accent); color: var(--ink); }
  [data-variant="secondary"] { background: var(--paper); color: var(--ink); }
  [data-variant="ghost"] { background: transparent; color: var(--ink); padding: 0 12px; }
  [data-size="icon"] { width: 48px; padding: 0; }
  [data-slot="button"] svg { width: 22px; height: 22px; flex: none; }
  [data-slot="button"]:disabled { opacity: 0.4; cursor: default; transform: none; }
  @media (hover: hover) and (pointer: fine) {
    [data-variant="default"]:hover { background: var(--accent-strong); }
    [data-variant="secondary"]:not(:disabled):hover, [data-variant="ghost"]:not(:disabled):hover { background: var(--surface-2); }
  }

  /* Barra */
  .bar { position: sticky; top: 0; z-index: 20; height: var(--bar); display: flex; align-items: center; gap: 32px; background: var(--bg); }
  .wordmark { font: 600 var(--step-lead)/1 var(--font); letter-spacing: -0.03em; text-decoration: none; color: var(--blue); margin-right: auto; display: inline-flex; align-items: center; min-height: 44px; }
  .wordmark b { color: var(--accent); font-weight: 600; }

  /* Catálogo */
  .head { padding-block: clamp(36px, 5vw, 72px) 40px; background: var(--blue); color: var(--on-blue); }
  .head h1 { grid-column: 1 / 9; font-size: var(--step-display); line-height: 0.94; }
  .head h1 .line { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
  .head h1 .line > span { display: inline-block; }
  .head .grid > p { grid-column: 9 / 13; align-self: end; font-size: var(--step-lead); line-height: 1.3; max-width: 25ch; }
  .slot { display: inline-flex; vertical-align: -0.035em; width: 1.7em; height: 0.67em; margin-left: 0.12em; overflow: hidden; }
  .slot img { width: 33.333%; height: 100%; object-fit: cover; object-position: 50% 40%; }
  .filters { margin-top: 46px; display: flex; flex-wrap: wrap; align-items: end; gap: 16px 32px; }
  .filters .label { display: block; font-weight: 600; margin-bottom: 8px; }
  .semester-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
  .semester-buttons button, .filters select, .page-picker select {
    min-width: 44px; min-height: 44px; padding: 0 11px; border: 0;
    background: var(--blue-2); color: var(--on-blue); font-weight: 600; cursor: pointer;
    transition: background-color var(--t-hover) ease, color var(--t-hover) ease;
  }
  .semester-buttons button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
  @media (hover: hover) { .semester-buttons button[aria-pressed="false"]:hover { background: var(--blue-3); } }
  .count { align-self: end; margin-left: auto; line-height: 44px; color: var(--on-blue); }

  /* Repisas por semestre */
  .shelves { padding-block: 12px 48px; }
  .shelf { padding-block: 34px 40px; border-bottom: 1px solid var(--surface-2); }
  .shelf[hidden], .books li[hidden], .empty[hidden] { display: none; }
  .shelf h2 { grid-column: 1 / 4; align-self: start; display: flex; align-items: baseline; gap: 0.3em; color: var(--blue); }
  .shelf h2 .num { font-size: var(--step-head); color: var(--accent-text); }
  .shelf h2 .word { font-size: var(--step-lead); font-weight: 600; letter-spacing: 0; }
  .books { grid-column: 4 / 13; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px var(--gap); }
  .book { border: 0; padding: 0; background: transparent; text-align: left; display: block; cursor: pointer; width: 100%; }
  .book .stage { position: relative; display: block; perspective: 1200px; aspect-ratio: 3 / 4; }
  .book .page-under { position: absolute; inset: 1.5% 0 1.5% 2%; border: 1px solid var(--surface-2); background: var(--paper); }
  .book .cover {
    display: block; position: relative; height: 100%; width: 100%; object-fit: contain; background: var(--paper);
    transform-origin: left center; transition: transform 500ms var(--ease-out);
    box-shadow: 2px 3px 6px rgb(20 27 46 / 0.13);
  }
  @media (hover: hover) and (pointer: fine) { .book:hover .cover { transform: rotateY(-26deg); } }
  .book:focus-visible .cover { transform: rotateY(-26deg); }
  .book.is-peek .cover { transform: rotateY(-22deg); }
  .book:active .cover { transform: rotateY(-38deg); transition-duration: 200ms; }
  .book .name { display: block; margin-top: 12px; font-weight: 600; line-height: 1.2; }
  .book .facts { display: block; color: var(--muted); font-size: 1rem; line-height: 1.3; margin-top: 4px; }
  .empty { grid-column: 4 / 13; align-self: center; }
  .foot {
    border-top: 6px solid var(--accent); background: var(--blue); color: var(--on-blue);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 24px;
  }
  .foot a { display: inline-flex; align-items: center; min-height: 44px; text-underline-offset: 0.22em; }

  /* Visor */
  .overlay {
    position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
    margin: 0; border: 0; padding: 18px; background: transparent; color: inherit; overflow: hidden;
  }
  .overlay[open] { display: grid; place-items: center; }
  .overlay::backdrop { background: rgb(20 27 46 / 0.67); }
  .panel {
    position: relative; width: min(1040px, 100%); max-height: 100%; overflow: auto;
    background: var(--blue); color: var(--on-blue); padding: 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px;
    animation: modal-in var(--modal-open-dur) var(--ease-out) both;
  }
  .overlay.is-closing .panel { animation: modal-out var(--modal-close-dur) var(--ease-out) both; }
  .viewer__close { position: absolute; top: 8px; right: 12px; z-index: 2; }
  .viewer__close[data-variant="ghost"] { color: var(--on-blue); }
  @media (hover: hover) { .viewer__close[data-variant="ghost"]:hover { background: var(--blue-2); } }
  .pager-wrap { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .pager {
    position: relative; aspect-ratio: 3 / 4; width: min(100%, 440px, max(200px, (100svh - 190px) * 0.75));
    margin-inline: auto; perspective: 1400px; touch-action: pan-y pinch-zoom;
    user-select: none; cursor: pointer; background: var(--paper);
  }
  .page { position: absolute; inset: 0; height: 100%; width: 100%; max-width: none; object-fit: contain; background: var(--paper); backface-visibility: hidden; }
  .page.turning { pointer-events: none; }
  .pager-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .page-picker { display: flex; align-items: center; gap: 8px; color: var(--on-blue); font-variant-numeric: tabular-nums; }
  .page-picker select { padding: 0 8px; }
  .viewer__info { display: flex; flex-direction: column; align-items: start; gap: 16px; padding-top: 32px; }
  .viewer__info h2 { font-size: clamp(1.9rem, 1.4rem + 2vw, 3.2rem); line-height: 1.05; text-wrap: pretty; }
  .viewer__info .facts { color: var(--sky); }
  .viewer__info a { display: inline-flex; align-items: center; min-height: 44px; text-underline-offset: 0.22em; }

  @keyframes rise { to { transform: none; } }
  @keyframes lift { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes modal-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modal-out { to { opacity: 0; transform: scale(var(--modal-scale)); } }
  @media (prefers-reduced-motion: no-preference) {
    .head h1 .line > span { transform: translateY(105%); animation: rise 660ms var(--ease-expo) forwards; animation-delay: calc(var(--i) * 90ms); }
    .head .grid > p { animation: lift 480ms var(--ease-out) both; }
    .shelf.is-entering { animation: lift 340ms var(--ease-out) both; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .book .stage .cover { transform: none; }
  }
  @media (max-width: 1050px) {
    .head h1 { grid-column: 1 / 13; }
    .head .grid > p { grid-column: 1 / 13; margin-top: 24px; }
    .shelf h2 { grid-column: 1 / 13; margin-bottom: 20px; }
    .books, .empty { grid-column: 1 / 13; }
  }
  @media (max-width: 680px) {
    .head h1 { font-size: clamp(2.625rem, 11vw, 4.125rem); }
    .slot { width: 1.3em; }
    .filters { margin-top: 32px; gap: 12px 16px; }
    .semester-buttons { row-gap: 6px; }
    .semester-buttons button { padding-inline: 8px; }
    .shelf { padding-block: 26px 30px; }
    .books { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .overlay { padding: 0; }
    .panel { width: 100%; height: 100%; grid-template-columns: 1fr; padding: 64px 20px 24px; gap: 22px; align-content: start; }
    .pager { width: min(100%, 330px, max(170px, (100svh - 185px) * 0.75)); }
    .viewer__info { padding-top: 0; }
  }
</style>
</head>
<body id="inicio">
<a class="skip" href="#libros">Saltar a los libros</a>
<header class="bar wrap">
  <a class="wordmark" href="pagina.html" aria-label="Editorial DT5, inicio">DT<b>5</b></a>
  <a data-slot="button" data-variant="default" href="#libros">Ver libros</a>
</header>
<main>
  <section class="head wrap" aria-labelledby="titulo">
    <div class="grid">
      <h1 id="titulo">
        <span class="line"><span style="--i:0">Libros de<span class="slot" aria-hidden="true">
          <img src="assets/libros/ciencias-naturales-ii/portada.webp" alt="">
          <img src="assets/libros/pensamiento-matematico-iv/portada.webp" alt="">
          <img src="assets/libros/temas-selectos-de-matematicas/portada.webp" alt="">
        </span></span></span>
        <span class="line"><span style="--i:1">bachillerato</span></span>
      </h1>
      <p>Elige un semestre y abre un libro para hojear la muestra.</p>
    </div>
    <div class="filters" id="libros">
      <div>
        <span class="label" id="semestre-l">Semestre</span>
        <div class="semester-buttons" role="group" aria-labelledby="semestre-l" data-semesters></div>
      </div>
      <label><span class="label">Materia</span><select data-subject><option value="">Todas las materias</option></select></label>
      <p class="count" role="status" data-count></p>
    </div>
    <noscript>Activa JavaScript para consultar las muestras.</noscript>
  </section>
  <div class="shelves wrap" data-shelves></div>
</main>
<footer class="foot wrap">
  <p>Editorial DT5 · Catálogo de bachillerato</p>
  <a href="#inicio">Volver arriba</a>
</footer>

<dialog class="overlay" aria-labelledby="v-title" data-overlay>
  <div class="panel">
    <button class="viewer__close" type="button" data-slot="button" data-variant="ghost" data-close autofocus>Cerrar</button>
    <div class="pager-wrap">
      <div class="pager" data-pager><img class="page" data-page alt="" draggable="false"></div>
      <div class="pager-nav">
        <button type="button" data-slot="button" data-variant="secondary" data-size="icon" aria-label="Página anterior" data-prev>←</button>
        <label class="page-picker">Página <select data-page-picker></select><span data-total></span></label>
        <button type="button" data-slot="button" data-variant="secondary" data-size="icon" aria-label="Página siguiente" data-next>→</button>
      </div>
      <p class="sr" role="status" data-page-status></p>
    </div>
    <div class="viewer__info">
      <p class="facts" data-v-facts></p>
      <h2 id="v-title"></h2>
      <p data-v-summary></p>
      <a target="_blank" rel="noopener" data-expand>Ampliar página ↗<span class="sr"> (abre otra pestaña)</span></a>
    </div>
  </div>
</dialog>
<script src="catalogo-libros.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
